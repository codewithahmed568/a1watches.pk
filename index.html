<!DOCTYPE html>
<html>
<head>
  <title>A1 Watches</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: black;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      height: 50px;
    }

    .hero {
      background: url('banner.jpg');
      background-size: cover;
      color: white;
      text-align: center;
      padding: 80px 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      background: black;
      color: white;
      padding: 8px;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }

    footer {
      background: black;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
  <h2>A1 Watches</h2>
</header>

<div class="hero">
  <h1>Luxury Watches Collection</h1>
  <p>Best Quality at Best Price</p>
</div>

<h2 style="text-align:center;">Featured Products</h2>

<div class="products">

  <div class="card">
    <img src="watch1.jpg">
    <h3>Classic Watch</h3>
    <p>Rs 3000</p>
    <button>Add to Cart</button>
  </div>

  <div class="card">
    <img src="watch2.jpg">
    <h3>Smart Watch</h3>
    <p>Rs 5000</p>
    <button>Add to Cart</button>
  </div>

  <div class="card">
    <img src="watch3.jpg">
    <h3>Luxury Watch</h3>
    <p>Rs 8000</p>
    <button>Add to Cart</button>
  </div>

</div>

<footer>
  © 2026 A1 Watches | All Rights Reserved
</footer>

</body>
</html>
